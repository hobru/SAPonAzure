<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowTrust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
    <style>
      .title   { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtle  { font-size: 13px; fill: #64748b; }
      .grp     { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .box-t   { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .box-s   { font-size: 12px; fill: #475569; }
      .mono    { font-size: 11px; fill: #475569; font-family: Consolas, monospace; }
      .flow    { font-size: 12.5px; fill: #1e293b; }
      .flownum { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .lbl     { font-size: 11.5px; fill: #334155; }
      .lblbg   { fill: #ffffff; opacity: 0.92; }
      .edge    { stroke: #334155; stroke-width: 2; fill: none; }
      .trust   { stroke: #9333ea; stroke-width: 2.4; stroke-dasharray: 7 5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="820" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Copilot Studio → IAS → MCP Gateway</text>
  <text x="40" y="72" class="subtle">Entra authenticates the human, but SAP IAS issues the token the gateway validates. BTP trial subaccount, Integration Suite / SWAPI artifact.</text>

  <!-- ============ Microsoft side (left) ============ -->
  <rect x="40" y="100" width="330" height="330" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="128" class="grp" fill="#1d4ed8">Microsoft cloud</text>

  <!-- Copilot Studio -->
  <rect x="62" y="148" width="286" height="118" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="80" y="176" class="box-t">Copilot Studio</text>
  <text x="80" y="197" class="box-s">MCP connection (Generic OAuth2)</text>
  <text x="80" y="215" class="box-s">Custom connector + Content-Type fix</text>
  <text x="80" y="236" class="mono">client_id = App-2 (&lt;app2-client-id&gt;)</text>
  <text x="80" y="252" class="mono">scopes = openid offline_access</text>

  <!-- Entra ID -->
  <rect x="62" y="296" width="286" height="116" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="80" y="324" class="box-t">Microsoft Entra ID</text>
  <text x="80" y="345" class="box-s">Corporate IdP that authenticates the user</text>
  <text x="80" y="366" class="mono">App-1 — IAS is the OIDC client</text>
  <text x="80" y="386" class="mono">tenant = &lt;entra-tenant-id&gt;</text>
  <text x="80" y="402" class="box-s">issues the sign-in assertion (not the API token)</text>

  <!-- ============ SAP IAS (center) ============ -->
  <rect x="455" y="150" width="320" height="300" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="475" y="178" class="grp" fill="#0e7490">SAP Cloud Identity Services — IAS</text>
  <text x="475" y="198" class="mono">&lt;ias-host&gt;.trial-accounts.ondemand.com</text>

  <!-- App-2 -->
  <rect x="477" y="214" width="276" height="104" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/>
  <text x="495" y="240" class="box-t">App-2 — application for Copilot Studio</text>
  <text x="495" y="261" class="box-s">OAuth client + gateway audience</text>
  <text x="495" y="281" class="mono">Client ID = &lt;app2-client-id&gt;</text>
  <text x="495" y="298" class="mono">Redirect = …azure-apim.net/redirect/…</text>
  <text x="495" y="313" class="box-s">Default IdP = Entra (Conditional Auth)</text>

  <!-- OIDC issuer -->
  <rect x="477" y="330" width="276" height="102" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.6"/>
  <text x="495" y="356" class="box-t">OIDC issuer + endpoints</text>
  <text x="495" y="377" class="mono">/oauth2/authorize  ·  /oauth2/token</text>
  <text x="495" y="393" class="mono">/.well-known/openid-configuration</text>
  <text x="495" y="409" class="mono">/oauth2/certs  (JWKS)</text>
  <text x="495" y="426" class="box-s">issues raw IAS JWT (iss = IAS, sap_id_type=user)</text>

  <!-- ============ SAP BTP (right) ============ -->
  <rect x="855" y="100" width="345" height="360" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="875" y="128" class="grp" fill="#15803d">SAP BTP — trial subaccount</text>
  <text x="875" y="147" class="mono">&lt;subaccount&gt; · region &lt;region&gt;</text>

  <!-- Trust config -->
  <rect x="877" y="162" width="301" height="86" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="895" y="188" class="box-t">Trust Configuration</text>
  <text x="895" y="209" class="box-s">Subaccount trusts IAS as OIDC IdP</text>
  <text x="895" y="229" class="box-s">(created on IAS subscription — reused for propagation)</text>

  <!-- MCP Gateway -->
  <rect x="877" y="262" width="301" height="180" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="895" y="290" class="box-t">MCP Gateway — Integration Suite</text>
  <text x="895" y="311" class="box-s">SWAPI artifact (Integration Cell)</text>
  <text x="895" y="333" class="box-s">Authentication: External (OIDC) → IAS</text>
  <text x="895" y="351" class="box-s">• validates JWT signature via IAS JWKS</text>
  <text x="895" y="368" class="box-s">• checks iss = IAS and aud = App-2</text>
  <text x="895" y="386" class="box-s">Authorization: claim allow-list (tid / sap_id_type)</text>
  <rect x="895" y="398" width="266" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="905" y="419" class="mono">…integration.cloud.sap/swapi</text>

  <!-- ============ User ============ -->
  <circle cx="80" cy="500" r="20" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <circle cx="80" cy="493" r="7" fill="#334155"/>
  <path d="M66,514 a14,10 0 0 1 28,0" fill="#334155"/>
  <text x="112" y="497" class="box-t">User</text>
  <text x="112" y="516" class="box-s">signs in through Copilot Studio</text>

  <!-- ============ Flows ============ -->
  <!-- U -> Copilot Studio -->
  <path class="edge" d="M100,492 C150,470 170,430 205,300" marker-end="url(#arrow)"/>

  <!-- 1: Copilot Studio -> IAS authorize -->
  <path class="edge" d="M348,200 C410,200 420,232 475,244" marker-end="url(#arrow)"/>
  <rect x="360" y="150" width="118" height="18" class="lblbg" rx="3"/>
  <text x="364" y="163" class="lbl">authorize (OAuth2)</text>
  <circle cx="415" cy="205" r="11" fill="#334155"/><text x="415" y="209" text-anchor="middle" class="flownum">1</text>

  <!-- 2: IAS -> Entra (federation) -->
  <path class="edge" d="M477,300 C420,320 360,330 348,342" marker-end="url(#arrow)"/>
  <rect x="352" y="300" width="120" height="18" class="lblbg" rx="3"/>
  <text x="356" y="313" class="lbl">delegate to corp IdP</text>
  <circle cx="405" cy="322" r="11" fill="#334155"/><text x="405" y="326" text-anchor="middle" class="flownum">2</text>

  <!-- 3: Entra auth back to IAS -->
  <path class="edge" d="M330,406 C430,430 470,420 560,436" marker-end="url(#arrow)"/>
  <rect x="352" y="440" width="150" height="18" class="lblbg" rx="3"/>
  <text x="356" y="453" class="lbl">user authenticates → back to IAS</text>
  <circle cx="450" cy="428" r="11" fill="#334155"/><text x="450" y="432" text-anchor="middle" class="flownum">3</text>

  <!-- 4: IAS -> Copilot Studio token -->
  <path class="edge" d="M475,268 C420,264 400,240 348,226" marker-end="url(#arrow)"/>
  <rect x="356" y="262" width="118" height="18" class="lblbg" rx="3"/>
  <text x="360" y="275" class="lbl">raw IAS JWT to CS</text>
  <circle cx="430" cy="248" r="11" fill="#334155"/><text x="430" y="252" text-anchor="middle" class="flownum">4</text>

  <!-- 5: Copilot Studio -> Gateway (bearer) -->
  <path class="edge" d="M300,148 C520,96 760,104 950,258" marker-end="url(#arrow)"/>
  <rect x="560" y="86" width="230" height="18" class="lblbg" rx="3"/>
  <text x="564" y="99" class="lbl">MCP call · Authorization: Bearer &lt;IAS JWT&gt;</text>
  <circle cx="640" cy="102" r="11" fill="#334155"/><text x="640" y="106" text-anchor="middle" class="flownum">5</text>

  <!-- 6: Gateway -> IAS validate (JWKS) -->
  <path class="edge" d="M877,352 C820,372 800,392 757,398" marker-end="url(#arrow)"/>
  <rect x="760" y="358" width="120" height="18" class="lblbg" rx="3"/>
  <text x="764" y="371" class="lbl">validate JWT (JWKS/iss/aud)</text>
  <circle cx="815" cy="368" r="11" fill="#334155"/><text x="815" y="372" text-anchor="middle" class="flownum">6</text>

  <!-- Trust dashed line IAS <-> subaccount -->
  <path class="trust" d="M700,196 C800,180 830,188 877,196" marker-end="url(#arrowTrust)" marker-start="url(#arrowTrust)"/>
  <rect x="720" y="160" width="130" height="18" class="lblbg" rx="3"/>
  <text x="724" y="173" class="lbl" fill="#7e22ce">trust (OIDC)</text>

  <!-- ============ Legend ============ -->
  <rect x="40" y="560" width="1160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="62" y="588" class="grp">Authentication flow</text>

  <text x="62" y="616" class="flow"><tspan font-weight="700">1.</tspan> User starts a tool call in Copilot Studio → CS launches OAuth2 <tspan font-family="Consolas,monospace">authorize</tspan> against IAS App-2.</text>
  <text x="62" y="640" class="flow"><tspan font-weight="700">2.</tspan> IAS delegates sign-in to its Corporate Identity Provider (Entra ID) — the Default Authenticating IdP.</text>
  <text x="62" y="664" class="flow"><tspan font-weight="700">3.</tspan> User authenticates at Entra; the assertion returns to IAS.</text>
  <text x="62" y="688" class="flow"><tspan font-weight="700">4.</tspan> IAS mints a <tspan font-weight="700">raw IAS JWT</tspan> (<tspan font-family="Consolas,monospace">iss = IAS, aud = App-2, sap_id_type = user, email = corp email</tspan>) and returns it to CS.</text>
  <text x="62" y="712" class="flow"><tspan font-weight="700">5.</tspan> CS calls the MCP Gateway with <tspan font-family="Consolas,monospace">Authorization: Bearer &lt;IAS JWT&gt;</tspan>.</text>
  <text x="62" y="736" class="flow"><tspan font-weight="700">6.</tspan> Gateway’s External (OIDC) policy validates the token against IAS (JWKS signature, <tspan font-family="Consolas,monospace">iss</tspan>, <tspan font-family="Consolas,monospace">aud</tspan>) + claim allow-list → serves SWAPI.</text>

  <line x1="62" y1="752" x2="1178" y2="752" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M980,588 l24,0" class="trust" marker-end="url(#arrowTrust)"/>
  <text x="1012" y="592" class="lbl" fill="#7e22ce">Subaccount ↔ IAS trust — not used for this front-door flow; it is what later enables JWT→X.509 principal propagation.</text>
</svg>
